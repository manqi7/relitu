<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D城市气温热力图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            overflow: hidden;
            height: 100vh;
        }
        
        #canvas {
            display: block;
        }
        
        #tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }
        
        #info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 100;
            min-width: 300px;
        }
        
        #info-panel h1 {
            font-size: 22px;
            color: #1a1a3e;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #info-panel .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        
        #info-panel .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        #info-panel .stat-label {
            color: #666;
        }
        
        #info-panel .stat-value {
            font-weight: 600;
            color: #1a1a3e;
        }
        
        #legend {
            margin-top: 15px;
        }
        
        #legend-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        
        #legend-bar {
            height: 20px;
            border-radius: 10px;
            background: linear-gradient(to right, 
                #0066ff 0%, 
                #00ccff 25%, 
                #00ff88 50%, 
                #ffcc00 75%, 
                #ff3300 100%
            );
        }
        
        #legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }
        
        .btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="tooltip"></div>
    
    <div id="info-panel">
        <h1>🌡️ 3D城市气温热力图</h1>
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">网格尺寸:</span>
                <span class="stat-value" id="grid-size">15×15</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最低温度:</span>
                <span class="stat-value" id="min-temp">20.0°C</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最高温度:</span>
                <span class="stat-value" id="max-temp">40.0°C</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">平均温度:</span>
                <span class="stat-value" id="avg-temp">30.0°C</span>
            </div>
        </div>
        
        <div id="legend">
            <div id="legend-title">温度图例</div>
            <div id="legend-bar"></div>
            <div id="legend-labels">
                <span>20°C</span>
                <span>25°C</span>
                <span>30°C</span>
                <span>35°C</span>
                <span>40°C</span>
            </div>
        </div>
        
        <button class="btn" id="regenerate-btn">🔄 重新生成数据</button>
    </div>
    
    <div id="instructions">
        🖱️ 左键拖拽旋转 | 滚轮缩放 | 右键拖拽平移 | 悬停查看详情 | 点击聚焦
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let buildings = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let hoveredBuilding = null;
        const GRID_SIZE = 15;
        const TEMP_MIN = 20;
        const TEMP_MAX = 40;
        
        init();
        animate();
        
        function init() {
            const canvas = document.getElementById('canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a3e);
            scene.fog = new THREE.Fog(0x1a1a3e, 20, 60);
            
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(20, 20, 20);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 50;
            controls.maxPolarAngle = Math.PI / 2.2;
            
            setupLighting();
            createGround();
            generateCityData();
            
            setupEventListeners();
            updateStats();
        }
        
        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(15, 25, 15);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 100;
            mainLight.shadow.camera.left = -30;
            mainLight.shadow.camera.right = 30;
            mainLight.shadow.camera.top = 30;
            mainLight.shadow.camera.bottom = -30;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight(0x6666ff, 0.3);
            fillLight.position.set(-10, 15, -10);
            scene.add(fillLight);
        }
        
        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(25, 25);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                metalness: 0.1,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.01;
            ground.receiveShadow = true;
            scene.add(ground);
            
            const gridHelper = new THREE.GridHelper(25, 25, 0x333355, 0x222244);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
        }
        
        function generateCityData() {
            buildings.forEach(building => scene.remove(building.mesh));
            buildings = [];
            
            const centerX = 0;
            const centerZ = 0;
            
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    const dx = x - (GRID_SIZE - 1) / 2;
                    const dz = z - (GRID_SIZE - 1) / 2;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    const maxDistance = Math.sqrt(2) * (GRID_SIZE / 2);
                    
                    const distanceFactor = 1 - (distance / maxDistance) * 0.6;
                    
                    const randomTemp = TEMP_MIN + Math.random() * (TEMP_MAX - TEMP_MIN);
                    const temperature = TEMP_MIN + (randomTemp - TEMP_MIN) * distanceFactor;
                    
                    createBuilding(x, z, temperature);
                }
            }
            
            updateStats();
        }
        
        function createBuilding(x, z, temperature) {
            const baseSize = 1.2;
            const gap = 0.4;
            const totalSize = baseSize + gap;
            
            const posX = (x - (GRID_SIZE - 1) / 2) * totalSize;
            const posZ = (z - (GRID_SIZE - 1) / 2) * totalSize;
            
            const heightScale = (temperature - TEMP_MIN) / (TEMP_MAX - TEMP_MIN);
            const height = 0.5 + heightScale * 5;
            
            const geometry = new THREE.BoxGeometry(baseSize, height, baseSize);
            const material = new THREE.MeshStandardMaterial({
                color: getTemperatureColor(temperature),
                metalness: 0.3,
                roughness: 0.5,
                emissive: 0x000000
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(posX, height / 2, posZ);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            const buildingData = {
                mesh: mesh,
                x: x,
                z: z,
                temperature: temperature,
                originalScale: mesh.scale.clone(),
                originalEmissive: material.emissive.clone()
            };
            
            mesh.userData = buildingData;
            buildings.push(buildingData);
            scene.add(mesh);
        }
        
        function getTemperatureColor(temperature) {
            const t = (temperature - TEMP_MIN) / (TEMP_MAX - TEMP_MIN);
            
            let r, g, b;
            
            if (t < 0.25) {
                const blend = t / 0.25;
                r = 0;
                g = Math.floor(102 + blend * 204);
                b = 255;
            } else if (t < 0.5) {
                const blend = (t - 0.25) / 0.25;
                r = 0;
                g = 255;
                b = Math.floor(255 - blend * 255);
            } else if (t < 0.75) {
                const blend = (t - 0.5) / 0.25;
                r = Math.floor(blend * 255);
                g = 255;
                b = 0;
            } else {
                const blend = (t - 0.75) / 0.25;
                r = 255;
                g = Math.floor(255 - blend * 204);
                b = 0;
            }
            
            return (r << 16) | (g << 8) | b;
        }
        
        function setupEventListeners() {
            const canvas = document.getElementById('canvas');
            
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('click', onClick);
            canvas.addEventListener('mouseleave', onMouseLeave);
            document.getElementById('regenerate-btn').addEventListener('click', generateCityData);
            window.addEventListener('resize', onWindowResize);
        }
        
        function onMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            checkHover(event.clientX, event.clientY);
        }
        
        function onClick() {
            raycaster.setFromCamera(mouse, camera);
            const meshes = buildings.map(b => b.mesh);
            const intersects = raycaster.intersectObjects(meshes);
            
            if (intersects.length > 0) {
                const buildingData = intersects[0].object.userData;
                console.log('点击详情:', {
                    区域: `${String.fromCharCode(65 + buildingData.x)}-${buildingData.z + 1}`,
                    X坐标: buildingData.x,
                    Z坐标: buildingData.z,
                    温度: buildingData.temperature.toFixed(1) + '°C',
                    位置: { x: buildingData.mesh.position.x, z: buildingData.mesh.position.z }
                });
                
                focusOnBuilding(buildingData);
            }
        }
        
        function onMouseLeave() {
            clearHover();
        }
        
        function checkHover(screenX, screenY) {
            raycaster.setFromCamera(mouse, camera);
            const meshes = buildings.map(b => b.mesh);
            const intersects = raycaster.intersectObjects(meshes);
            
            if (intersects.length > 0) {
                const buildingData = intersects[0].object.userData;
                
                if (hoveredBuilding !== buildingData) {
                    clearHover();
                    hoveredBuilding = buildingData;
                    applyHoverEffect(buildingData);
                }
                
                showTooltip(screenX, screenY, buildingData);
            } else {
                clearHover();
            }
        }
        
        function applyHoverEffect(buildingData) {
            buildingData.mesh.material.emissive.setHex(0x333333);
            buildingData.mesh.scale.set(
                buildingData.originalScale.x * 1.1,
                buildingData.originalScale.y * 1.02,
                buildingData.originalScale.z * 1.1
            );
        }
        
        function clearHover() {
            if (hoveredBuilding) {
                hoveredBuilding.mesh.material.emissive.copy(hoveredBuilding.originalEmissive);
                hoveredBuilding.mesh.scale.copy(hoveredBuilding.originalScale);
                hoveredBuilding = null;
            }
            hideTooltip();
        }
        
        function showTooltip(x, y, buildingData) {
            const tooltip = document.getElementById('tooltip');
            const zoneLabel = `${String.fromCharCode(65 + buildingData.x)}-${buildingData.z + 1}`;
            
            tooltip.innerHTML = `
                <div style="font-weight: 600; margin-bottom: 5px;">区域 ${zoneLabel}</div>
                <div style="font-size: 16px; color: #4CAF50;">
                    🌡️ ${buildingData.temperature.toFixed(1)}°C
                </div>
            `;
            
            tooltip.style.display = 'block';
            tooltip.style.left = (x + 15) + 'px';
            tooltip.style.top = (y + 15) + 'px';
        }
        
        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }
        
        function focusOnBuilding(buildingData) {
            const targetPos = new THREE.Vector3(
                buildingData.mesh.position.x,
                buildingData.mesh.position.y + 2,
                buildingData.mesh.position.z
            );
            
            const startPos = camera.position.clone();
            const endPos = targetPos.clone().add(new THREE.Vector3(5, 5, 5));
            
            let progress = 0;
            const duration = 500;
            const startTime = Date.now();
            
            function animateCamera() {
                const elapsed = Date.now() - startTime;
                progress = Math.min(elapsed / duration, 1);
                
                const t = 1 - Math.pow(1 - progress, 3);
                
                camera.position.lerpVectors(startPos, endPos, t);
                camera.lookAt(targetPos);
                controls.target.lerp(targetPos, t);
                
                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }
            
            animateCamera();
        }
        
        function updateStats() {
            if (buildings.length === 0) return;
            
            const temps = buildings.map(b => b.temperature);
            const minTemp = Math.min(...temps);
            const maxTemp = Math.max(...temps);
            const avgTemp = temps.reduce((a, b) => a + b, 0) / temps.length;
            
            document.getElementById('grid-size').textContent = `${GRID_SIZE}×${GRID_SIZE}`;
            document.getElementById('min-temp').textContent = `${minTemp.toFixed(1)}°C`;
            document.getElementById('max-temp').textContent = `${maxTemp.toFixed(1)}°C`;
            document.getElementById('avg-temp').textContent = `${avgTemp.toFixed(1)}°C`;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            const time = Date.now() * 0.001;
            buildings.forEach((building, index) => {
                const wave = Math.sin(time * 2 + index * 0.1) * 0.005;
                building.mesh.position.y = building.mesh.geometry.parameters.height / 2 + wave;
            });
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 城市气温热力图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
        }

        #container {
            width: 100vw;
            height: 100vh;
        }

        #tooltip {
            position: absolute;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        #tooltip .region-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
            color: #4fc3f7;
        }

        #tooltip .temperature {
            font-size: 24px;
            font-weight: bold;
        }

        #tooltip .temp-unit {
            font-size: 16px;
            color: #aaa;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #info-panel h1 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #4fc3f7;
        }

        #info-panel p {
            margin: 6px 0;
            color: #ccc;
            font-size: 13px;
        }

        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border-radius: 12px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #legend h3 {
            margin-bottom: 10px;
            font-size: 14px;
            color: #4fc3f7;
        }

        .legend-bar {
            width: 200px;
            height: 20px;
            background: linear-gradient(to right, #2196f3, #4caf50, #ffeb3b, #ff9800, #f44336);
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="tooltip">
        <div class="region-name" id="tooltip-region">区域 A-1</div>
        <div class="temperature">
            <span id="tooltip-temp">32.5</span>
            <span class="temp-unit">°C</span>
        </div>
    </div>

    <div id="info-panel">
        <h1>🏙️ 3D 城市气温热力图</h1>
        <p>🖱️ 拖拽旋转视角</p>
        <p>🔍 滚轮缩放</p>
        <p>👆 悬停查看温度</p>
        <p>🎯 点击聚焦区域</p>
    </div>

    <div id="legend">
        <h3>🌡️ 温度图例</h3>
        <div class="legend-bar"></div>
        <div class="legend-labels">
            <span>20°C</span>
            <span>25°C</span>
            <span>30°C</span>
            <span>35°C</span>
            <span>40°C</span>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==================== 全局变量 ====================
        let scene, camera, renderer, controls;
        let raycaster, mouse;
        let bars = [];
        let hoveredBar = null;
        let originalScale = new THREE.Vector3();
        let targetCameraPosition = null;
        let targetControlsTarget = null;

        const GRID_SIZE = 12;
        const CELL_SIZE = 2;
        const CELL_GAP = 0.3;
        const MIN_TEMP = 20;
        const MAX_TEMP = 40;
        const MIN_HEIGHT = 0.5;
        const MAX_HEIGHT = 8;

        // ==================== 初始化 ====================
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 50, 150);

            // 创建相机
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(35, 30, 35);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);

            // 创建控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 15;
            controls.maxDistance = 100;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.target.set(0, 0, 0);

            // 初始化射线检测
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 添加灯光
            addLights();

            // 创建地面
            createGround();

            // 生成城市数据并创建柱状图
            generateCityData();

            // 添加事件监听
            addEventListeners();

            // 开始动画循环
            animate();
        }

        // ==================== 灯光设置 ====================
        function addLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);

            // 主方向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(30, 50, 30);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 150;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            directionalLight.shadow.bias = -0.0001;
            scene.add(directionalLight);

            // 补光
            const fillLight = new THREE.DirectionalLight(0x4fc3f7, 0.3);
            fillLight.position.set(-20, 20, -20);
            scene.add(fillLight);

            // 底部补光
            const bottomLight = new THREE.HemisphereLight(0x404080, 0x080820, 0.5);
            scene.add(bottomLight);
        }

        // ==================== 创建地面 ====================
        function createGround() {
            const groundSize = GRID_SIZE * (CELL_SIZE + CELL_GAP) + 10;
            
            // 主地面
            const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x1e1e3f,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.01;
            ground.receiveShadow = true;
            scene.add(ground);

            // 网格辅助线
            const gridHelper = new THREE.GridHelper(groundSize, GRID_SIZE * 2, 0x3a3a5a, 0x2a2a4a);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
        }

        // ==================== 温度到颜色映射 ====================
        function temperatureToColor(temperature) {
            const t = (temperature - MIN_TEMP) / (MAX_TEMP - MIN_TEMP);
            
            let r, g, b;
            
            if (t < 0.25) {
                const localT = t / 0.25;
                r = 0.13;
                g = 0.59 + localT * 0.18;
                b = 0.95 - localT * 0.15;
            } else if (t < 0.5) {
                const localT = (t - 0.25) / 0.25;
                r = 0.13 + localT * 0.17;
                g = 0.77 - localT * 0.02;
                b = 0.80 - localT * 0.49;
            } else if (t < 0.75) {
                const localT = (t - 0.5) / 0.25;
                r = 0.30 + localT * 0.70;
                g = 0.75 - localT * 0.16;
                b = 0.31 - localT * 0.12;
            } else {
                const localT = (t - 0.75) / 0.25;
                r = 1.0;
                g = 0.59 - localT * 0.32;
                b = 0.19 - localT * 0.19;
            }
            
            return new THREE.Color(r, g, b);
        }

        // ==================== 温度到高度映射 ====================
        function temperatureToHeight(temperature) {
            const t = (temperature - MIN_TEMP) / (MAX_TEMP - MIN_TEMP);
            return MIN_HEIGHT + t * (MAX_HEIGHT - MIN_HEIGHT);
        }

        // ==================== 生成城市数据 ====================
        function generateCityData() {
            const cityData = [];
            const totalSize = GRID_SIZE * (CELL_SIZE + CELL_GAP);
            const offset = totalSize / 2 - (CELL_SIZE + CELL_GAP) / 2;

            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const x = i * (CELL_SIZE + CELL_GAP) - offset;
                    const z = j * (CELL_SIZE + CELL_GAP) - offset;
                    
                    const baseTemp = MIN_TEMP + Math.random() * (MAX_TEMP - MIN_TEMP);
                    const noise = Math.sin(i * 0.5) * Math.cos(j * 0.5) * 3;
                    const temperature = Math.max(MIN_TEMP, Math.min(MAX_TEMP, baseTemp + noise));
                    
                    cityData.push({
                        x: x,
                        z: z,
                        temperature: temperature,
                        gridX: i,
                        gridZ: j,
                        name: `区域 ${String.fromCharCode(65 + i)}-${j + 1}`
                    });
                }
            }

            createBars(cityData);
        }

        // ==================== 创建柱状图 ====================
        function createBars(data) {
            const barGeometry = new THREE.BoxGeometry(CELL_SIZE * 0.9, 1, CELL_SIZE * 0.9);
            
            data.forEach((item, index) => {
                const height = temperatureToHeight(item.temperature);
                const color = temperatureToColor(item.temperature);
                
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.4,
                    metalness: 0.3,
                    emissive: color,
                    emissiveIntensity: 0.1
                });

                const bar = new THREE.Mesh(barGeometry, material);
                bar.position.set(item.x, height / 2, item.z);
                bar.scale.y = height;
                bar.castShadow = true;
                bar.receiveShadow = true;

                bar.userData = {
                    temperature: item.temperature,
                    name: item.name,
                    gridX: item.gridX,
                    gridZ: item.gridZ,
                    originalColor: color.clone(),
                    originalHeight: height
                };

                scene.add(bar);
                bars.push(bar);
            });
        }

        // ==================== 事件监听 ====================
        function addEventListeners() {
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bars);

            const tooltip = document.getElementById('tooltip');

            if (intersects.length > 0) {
                const bar = intersects[0].object;
                
                if (hoveredBar !== bar) {
                    if (hoveredBar) {
                        resetBarHighlight(hoveredBar);
                    }
                    
                    hoveredBar = bar;
                    highlightBar(bar);
                }

                const data = bar.userData;
                document.getElementById('tooltip-region').textContent = data.name;
                document.getElementById('tooltip-temp').textContent = data.temperature.toFixed(1);
                
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
                
                document.body.style.cursor = 'pointer';
            } else {
                if (hoveredBar) {
                    resetBarHighlight(hoveredBar);
                    hoveredBar = null;
                }
                
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bars);

            if (intersects.length > 0) {
                const bar = intersects[0].object;
                const data = bar.userData;
                
                console.log('========================================');
                console.log(`📍 ${data.name}`);
                console.log(`🌡️ 温度: ${data.temperature.toFixed(2)}°C`);
                console.log(`📏 高度: ${data.originalHeight.toFixed(2)} 单位`);
                console.log(`📍 网格位置: (${data.gridX}, ${data.gridZ})`);
                console.log(`🎨 颜色: RGB(${Math.round(data.originalColor.r * 255)}, ${Math.round(data.originalColor.g * 255)}, ${Math.round(data.originalColor.b * 255)})`);
                console.log('========================================');

                focusOnBar(bar);
            }
        }

        // ==================== 高亮效果 ====================
        function highlightBar(bar) {
            const data = bar.userData;
            
            bar.material.emissiveIntensity = 0.5;
            bar.scale.x = 1.1;
            bar.scale.z = 1.1;
        }

        function resetBarHighlight(bar) {
            bar.material.emissiveIntensity = 0.1;
            bar.scale.x = 1;
            bar.scale.z = 1;
        }

        // ==================== 相机聚焦 ====================
        function focusOnBar(bar) {
            const barPosition = bar.position.clone();
            
            targetControlsTarget = barPosition;
            
            const direction = new THREE.Vector3(1, 1, 1).normalize();
            const distance = 20;
            targetCameraPosition = barPosition.clone().add(direction.multiplyScalar(distance));
        }

        // ==================== 动画循环 ====================
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            if (targetCameraPosition && targetControlsTarget) {
                camera.position.lerp(targetCameraPosition, 0.05);
                controls.target.lerp(targetControlsTarget, 0.05);
                
                if (camera.position.distanceTo(targetCameraPosition) < 0.1) {
                    targetCameraPosition = null;
                    targetControlsTarget = null;
                }
            }

            bars.forEach((bar, index) => {
                const time = Date.now() * 0.001;
                const offset = index * 0.1;
                bar.material.emissiveIntensity = 0.1 + Math.sin(time + offset) * 0.05;
            });

            renderer.render(scene, camera);
        }

        // ==================== 启动应用 ====================
        init();
    </script>
</body>
</html>
